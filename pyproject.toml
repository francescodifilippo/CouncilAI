[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "consilium"
version = "0.1.0.dev0"
description = "A turn-based debate orchestrator for AI CLIs and humans (Phase 0 skeleton)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Francesco Di Filippo" }]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["multi-agent", "debate", "orchestration", "llm", "cli"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Deliberately minimal. Phase 0 runs on two dependencies:
#   pexpect — the universal TTY adapter
#   PyYAML  — debate configuration
# The API adapter uses urllib from the standard library on purpose, so that
# adding a model never requires adding a dependency.
dependencies = [
    "pexpect>=4.9",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
consilium = "consilium.__main__:main"

[project.urls]
Repository = "https://github.com/francescodifilippo/CouncilAI"
Specification = "https://github.com/francescodifilippo/CouncilAI/blob/main/SPECIFICATION.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
